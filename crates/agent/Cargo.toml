[package]
name = "remote-desk-agent"
description = "Host agent: registers with the control plane, gates sessions, streams the screen"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rd-agent"
path = "src/main.rs"

[dependencies]
proto.workspace = true
remote-desk-server.workspace = true
anyhow.workspace = true
argon2.workspace = true
clap.workspace = true
dirs.workspace = true
futures-util.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tracing.workspace = true
tracing-subscriber.workspace = true

# Menu-bar app (Remote Desk.app). Windows/Linux GUIs come later.
[target.'cfg(target_os = "macos")'.dependencies]
tao.workspace = true
tray-icon.workspace = true

[lints]
workspace = true
