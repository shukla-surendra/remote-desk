<!doctype html><html><head><meta charset="utf-8"><title>Remote Desk</title>
<style>body{margin:0;background:#111;color:#eee;font:15px system-ui;display:flex;flex-direction:column;align-items:center}
#login{margin-top:15vh;display:flex;flex-direction:column;gap:10px;width:260px}input,button{padding:10px;border-radius:6px;border:0;font-size:15px}
button{background:#3b82f6;color:#fff;cursor:pointer}#err{color:#f87171}canvas{max-width:100vw;max-height:100vh;display:none;cursor:default}</style></head>
<body><div id="login"><h2>Remote Desk</h2><input id="id" placeholder="Host ID" inputmode="numeric"><input id="pw" type="password" placeholder="Password"><button id="go">Connect</button><div id="err"></div></div>
<canvas id="c" tabindex="0"></canvas>
<script>
const $=id=>document.getElementById(id),c=$('c'),ctx=c.getContext('2d');let ws;
$('go').onclick=()=>{
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/viewer');ws.binaryType='blob';
  ws.onopen=()=>ws.send(JSON.stringify({id:$('id').value.trim(),password:$('pw').value}));
  ws.onmessage=async e=>{
    if(typeof e.data==='string'){const m=JSON.parse(e.data);
      if(m.type==='error')$('err').textContent=m.error;
      if(m.type==='connected'){$('login').style.display='none';c.style.display='block';c.focus()}
      return}
    const bmp=await createImageBitmap(e.data);c.width=bmp.width;c.height=bmp.height;ctx.drawImage(bmp,0,0)};
  ws.onclose=()=>{c.style.display='none';$('login').style.display='flex'};
};
const send=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
const pos=e=>{const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}};
let last=0;
c.onmousemove=e=>{const n=performance.now();if(n-last>30){last=n;send({type:'move',...pos(e)})}};
c.onmousedown=e=>send({type:'down',button:e.button,...pos(e)});
c.onmouseup=e=>send({type:'up',button:e.button,...pos(e)});
c.onwheel=e=>{e.preventDefault();send({type:'wheel',dy:e.deltaY,...pos(e)})};
c.oncontextmenu=e=>e.preventDefault();
c.onkeydown=e=>{e.preventDefault();send({type:'keydown',key:e.key})};
c.onkeyup=e=>{e.preventDefault();send({type:'keyup',key:e.key})};
</script></body></html>
